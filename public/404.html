<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stranica nije pronađena | Pogon</title>
    <meta name="description" content="Tražena Pogon stranica nije pronađena.">
    <meta name="robots" content="noindex,follow">
    <link rel="icon" href="/Logo.png">
    <style>
      *{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#090909;font-family:Arial,Helvetica,sans-serif}main{display:grid;min-height:100vh;place-items:center;padding:32px}.card{width:min(680px,100%);border:1px solid #ddd;border-radius:32px;background:#fff;padding:clamp(32px,7vw,64px);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.08)}img{width:120px;height:auto}.code{margin:32px 0 0;color:#397700;font-size:14px;font-weight:900;letter-spacing:.2em}h1{margin:12px 0 18px;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.05em}p{margin:0 auto;max-width:500px;color:#555;font-size:18px;line-height:1.6}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}a{border-radius:999px;padding:13px 22px;background:#090909;color:#fff;font-weight:800;text-decoration:none}.secondary{border:1px solid #ccc;background:#fff;color:#090909}
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <a href="/" aria-label="Pogon početna"><img src="/Logo.png" alt="Pogon"></a>
        <p class="code">GREŠKA 404</p>
        <h1>Stranica nije pronađena</h1>
        <p>Adresa možda nije ispravna ili je stranica uklonjena. Možete se vratiti na početnu stranicu ili pogledati Pogon električne bicikle.</p>
        <div class="actions">
          <a href="/">Početna stranica</a>
          <a class="secondary" href="/elektricni-bicikli/">Električni bicikli</a>
        </div>
      </section>
    </main>
  </body>
</html>
